<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" rx="6" fill="#0A1C2E"/>
  <!-- Simplified constellation on dark bg -->
  <line x1="5" y1="7"  x2="10" y2="4"  stroke="white" stroke-width="0.8" opacity="0.70"/>
  <line x1="10" y1="4" x2="16" y2="3"  stroke="white" stroke-width="0.8" opacity="0.70"/>
  <line x1="16" y1="3" x2="20" y2="7"  stroke="white" stroke-width="0.7" opacity="0.60"/>
  <line x1="20" y1="7" x2="21" y2="13" stroke="white" stroke-width="0.7" opacity="0.55"/>
  <line x1="21" y1="13" x2="19" y2="19" stroke="white" stroke-width="0.7" opacity="0.60"/>
  <line x1="19" y1="19" x2="14" y2="23" stroke="white" stroke-width="0.8" opacity="0.70"/>
  <line x1="14" y1="23" x2="7"  y2="21" stroke="white" stroke-width="0.8" opacity="0.70"/>
  <line x1="7"  y1="21" x2="4"  y2="16" stroke="white" stroke-width="0.8" opacity="0.70"/>
  <line x1="4"  y1="16" x2="5"  y2="7"  stroke="white" stroke-width="0.8" opacity="0.70"/>
  <!-- Converging lines -->
  <line x1="5"  y1="7"  x2="25" y2="13" stroke="white" stroke-width="0.4" opacity="0.50"/>
  <line x1="10" y1="4"  x2="25" y2="13" stroke="white" stroke-width="0.4" opacity="0.50"/>
  <line x1="19" y1="19" x2="25" y2="13" stroke="white" stroke-width="0.4" opacity="0.45"/>
  <line x1="14" y1="23" x2="25" y2="13" stroke="white" stroke-width="0.4" opacity="0.50"/>
  <line x1="4"  y1="16" x2="25" y2="13" stroke="white" stroke-width="0.4" opacity="0.50"/>
  <!-- Nodes -->
  <circle cx="5"  cy="7"  r="1.8" fill="#E6D6A6"/>
  <circle cx="10" cy="4"  r="2"   fill="white"/>
  <circle cx="16" cy="3"  r="1.8" fill="white" opacity="0.85"/>
  <circle cx="20" cy="7"  r="1.6" fill="#A6B2BF"/>
  <circle cx="21" cy="13" r="1.4" fill="#A6B2BF" opacity="0.75"/>
