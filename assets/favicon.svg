  <circle cx="25" cy="13" r="4" stroke="#E6D6A6" stroke-width="1" fill="none"/>
  <path d="M25 9.5 L25.7 12 L28.2 11.3 L26.7 13 L28.2 14.7 L25.7 14 L25 16.5 L24.3 14 L21.8 14.7 L23.3 13 L21.8 11.3 L24.3 12 Z" fill="#E6D6A6"/>
