<svg viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep Navy background -->
  <rect width="800" height="500" fill="#0A1C2E"/>

  <!-- ── Flowing contour / wave lines (background, subtle) ── -->
  <path d="M260 140 Q310 110 380 195" stroke="white" stroke-width="0.8" opacity="0.12" fill="none"/>
  <path d="M240 160 Q300 125 380 200" stroke="white" stroke-width="0.8" opacity="0.10" fill="none"/>
  <path d="M255 260 Q305 290 380 210" stroke="white" stroke-width="0.8" opacity="0.12" fill="none"/>
  <path d="M235 280 Q295 315 380 205" stroke="white" stroke-width="0.8" opacity="0.10" fill="none"/>
  <path d="M265 175 Q325 148 380 198" stroke="white" stroke-width="0.6" opacity="0.08" fill="none"/>
  <path d="M265 235 Q320 260 380 203" stroke="white" stroke-width="0.6" opacity="0.08" fill="none"/>

  <!-- ── Constellation polygon edges ── -->
  <!-- Top arc -->
  <line x1="170" y1="155" x2="220" y2="120" stroke="white" stroke-width="1.2" opacity="0.75"/>
  <line x1="220" y1="120" x2="285" y2="108" stroke="white" stroke-width="1.2" opacity="0.75"/>
  <line x1="285" y1="108" x2="330" y2="130" stroke="white" stroke-width="1.0" opacity="0.65"/>
  <!-- Right side -->
  <line x1="330" y1="130" x2="348" y2="175" stroke="white" stroke-width="1.0" opacity="0.60"/>
  <line x1="348" y1="175" x2="345" y2="230" stroke="white" stroke-width="0.9" opacity="0.55"/>
  <line x1="345" y1="230" x2="325" y2="275" stroke="white" stroke-width="1.0" opacity="0.60"/>
  <!-- Bottom arc -->
  <line x1="325" y1="275" x2="270" y2="300" stroke="white" stroke-width="1.2" opacity="0.75"/>
  <line x1="270" y1="300" x2="205" y2="290" stroke="white" stroke-width="1.2" opacity="0.75"/>
  <!-- Left side -->
  <line x1="205" y1="290" x2="155" y2="250" stroke="white" stroke-width="1.2" opacity="0.75"/>
  <line x1="155" y1="250" x2="155" y2="190" stroke="white" stroke-width="1.2" opacity="0.75"/>
  <line x1="155" y1="190" x2="170" y2="155" stroke="white" stroke-width="1.2" opacity="0.75"/>

  <!-- Cross / interior edges -->
  <line x1="170" y1="155" x2="285" y2="108" stroke="white" stroke-width="0.7" opacity="0.40"/>
  <line x1="170" y1="155" x2="310" y2="200" stroke="white" stroke-width="0.7" opacity="0.35"/>
  <line x1="220" y1="120" x2="310" y2="200" stroke="white" stroke-width="0.7" opacity="0.35"/>
  <line x1="155" y1="250" x2="270" y2="300" stroke="white" stroke-width="0.7" opacity="0.40"/>
  <line x1="205" y1="290" x2="345" y2="230" stroke="white" stroke-width="0.7" opacity="0.35"/>
  <line x1="310" y1="200" x2="345" y2="230" stroke="white" stroke-width="0.7" opacity="0.35"/>
  <line x1="310" y1="200" x2="348" y2="175" stroke="white" stroke-width="0.7" opacity="0.35"/>

  <!-- ── Converging lines from all outer nodes toward focal star ── -->
  <line x1="170" y1="155" x2="440" y2="200" stroke="white" stroke-width="0.6" opacity="0.50"/>
  <line x1="220" y1="120" x2="440" y2="200" stroke="white" stroke-width="0.6" opacity="0.50"/>
  <line x1="285" y1="108" x2="440" y2="200" stroke="white" stroke-width="0.6" opacity="0.48"/>
  <line x1="330" y1="130" x2="440" y2="200" stroke="white" stroke-width="0.6" opacity="0.45"/>
  <line x1="348" y1="175" x2="440" y2="200" stroke="white" stroke-width="0.6" opacity="0.42"/>
  <line x1="345" y1="230" x2="440" y2="200" stroke="white" stroke-width="0.6" opacity="0.42"/>
  <line x1="325" y1="275" x2="440" y2="200" stroke="white" stroke-width="0.6" opacity="0.45"/>
  <line x1="270" y1="300" x2="440" y2="200" stroke="white" stroke-width="0.6" opacity="0.48"/>
  <line x1="205" y1="290" x2="440" y2="200" stroke="white" stroke-width="0.6" opacity="0.50"/>
  <line x1="155" y1="250" x2="440" y2="200" stroke="white" stroke-width="0.6" opacity="0.50"/>
  <line x1="155" y1="190" x2="440" y2="200" stroke="white" stroke-width="0.6" opacity="0.50"/>
  <line x1="310" y1="200" x2="440" y2="200" stroke="white" stroke-width="0.5" opacity="0.38"/>

  <!-- Dotted converging lines -->
  <line x1="220" y1="120" x2="440" y2="200" stroke="white" stroke-width="0.4" stroke-dasharray="3,4" opacity="0.30"/>
  <line x1="270" y1="300" x2="440" y2="200" stroke="white" stroke-width="0.4" stroke-dasharray="3,4" opacity="0.30"/>

  <!-- ── Inner nodes (Fog color, smaller) ── -->
  <circle cx="310" cy="200" r="5" fill="#A6B2BF" opacity="0.80"/>
  <circle cx="250" cy="165" r="4" fill="#A6B2BF" opacity="0.70"/>
  <circle cx="245" cy="250" r="4" fill="#A6B2BF" opacity="0.65"/>
  <circle cx="290" cy="165" r="3.5" fill="#A6B2BF" opacity="0.60"/>
  <circle cx="295" cy="245" r="3.5" fill="#A6B2BF" opacity="0.60"/>

  <!-- ── Outer polygon nodes (white and gold, prominent) ── -->
  <circle cx="170" cy="155" r="7.5" fill="#E6D6A6"/>
  <circle cx="220" cy="120" r="8" fill="white"/>
  <circle cx="285" cy="108" r="7" fill="white" opacity="0.92"/>
  <circle cx="330" cy="130" r="6.5" fill="white" opacity="0.85"/>
  <circle cx="348" cy="175" r="6" fill="#A6B2BF" opacity="0.80"/>
  <circle cx="345" cy="230" r="6" fill="#A6B2BF" opacity="0.75"/>
  <circle cx="325" cy="275" r="6.5" fill="white" opacity="0.85"/>
  <circle cx="270" cy="300" r="7" fill="white" opacity="0.92"/>
  <circle cx="205" cy="290" r="7.5" fill="#E6D6A6"/>
  <circle cx="155" cy="250" r="8" fill="white"/>
  <circle cx="155" cy="190" r="7.5" fill="white" opacity="0.90"/>

  <!-- ── Vertical dotted line ── -->
  <line x1="500" y1="140" x2="500" y2="265" stroke="#E6D6A6" stroke-width="1.2" stroke-dasharray="3,5" opacity="0.55"/>

  <!-- ── Focal circle ── -->
  <circle cx="440" cy="200" r="22" stroke="#E6D6A6" stroke-width="2" fill="none"/>

  <!-- ── 8-pointed compass star ── -->
  <path d="
    M440 183
    L442.8 193.8
    L453.5 191
    L447.5 200
    L453.5 209
    L442.8 206.2
    L440 217
    L437.2 206.2
    L426.5 209
    L432.5 200
    L426.5 191
    L437.2 193.8
    Z
  " fill="#E6D6A6"/>

  <!-- ── Arrow from circle ── -->
  <line x1="462" y1="200" x2="498" y2="200" stroke="#E6D6A6" stroke-width="2"/>
  <path d="M491 193 L499 200 L491 207" stroke="#E6D6A6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── Wordmark: NAVISIGNAL ── -->
  <text
    x="400" y="370"
    text-anchor="middle"
    font-family="'Space Grotesk', 'Inter', sans-serif"
    font-size="52"
    font-weight="300"
    letter-spacing="20"
    fill="white"
    opacity="0.95"
  >NAVISIGNAL</text>

  <!-- ── Wordmark: INSIGHTS ── -->
  <text
    x="400" y="415"
    text-anchor="middle"
    font-family="'Space Grotesk', 'Inter', sans-serif"
    font-size="22"
    font-weight="400"
    letter-spacing="18"
    fill="#E6D6A6"
    opacity="0.90"
  >INSIGHTS</text>
</svg>
